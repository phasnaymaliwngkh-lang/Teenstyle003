###############################################################################
# TEENSTYLE AI — Docker Compose (STEP 35)
#
# ใช้งาน:
#   docker compose up -d postgres redis   # เปิดแค่ฐานข้อมูล + cache (แนะนำตอน dev)
#   docker compose up -d                  # เปิดทั้งระบบรวม frontend/backend
#   docker compose down                   # ปิด (ข้อมูลยังอยู่ใน volume)
#   docker compose down -v                # ปิดและลบข้อมูลทั้งหมด
#
# ⚠️ ต้องเปิด Docker Desktop ก่อน
# ค่าทั้งหมดอ่านจากไฟล์ .env ที่ root (คัดลอกจาก .env.example)
###############################################################################

services:
  postgres:
    image: postgres:17-alpine
    container_name: teenstyle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teenstyle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teenstyle_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-teenstyle}
      # เร่ง initdb และให้ collation คงที่ทุกเครื่อง
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: ${TZ:-Asia/Bangkok}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teenstyle} -d ${POSTGRES_DB:-teenstyle}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - teenstyle

  redis:
    image: redis:7-alpine
    container_name: teenstyle-redis
    restart: unless-stopped
    # appendonly เพื่อไม่ให้ job ที่ค้างใน BullMQ หายตอน restart (STEP 52)
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - teenstyle

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: teenstyle-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BACKEND_PORT: 4000
      BACKEND_URL: ${BACKEND_URL:-http://localhost:4000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # ใช้ชื่อ service เป็น host เพราะอยู่ใน network เดียวกัน
      DATABASE_URL: postgresql://${POSTGRES_USER:-teenstyle}:${POSTGRES_PASSWORD:-teenstyle_dev_password}@postgres:5432/${POSTGRES_DB:-teenstyle}?schema=public
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH_SECRET: ${AUTH_SECRET:-}
      BACKEND_JWT_SECRET: ${BACKEND_JWT_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # รูปที่อัปโหลด (STEP 47) — ต้องอยู่บน volume ไม่งั้นหายทุกครั้งที่สร้าง container ใหม่
      UPLOAD_DIR: /app/uploads
      PAYMENT_SECRET: ${PAYMENT_SECRET:-}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
    volumes:
      - uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    networks:
      - teenstyle

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        # NEXT_PUBLIC_* ต้องมีตอน build เพราะถูกฝังลง bundle
        #
        # ⚠️ ค่านี้ถูกใช้ 2 ทาง และใน compose ต้องเป็น **ชื่อ service** ไม่ใช่ localhost:
        #    1. Server Component ของ Next ยิงไป backend ตรง ๆ จากใน container
        #    2. ปลายทางของ rewrite ที่ next.config.ts ทำให้เบราว์เซอร์
        #    `localhost` ใน container ของ frontend คือตัว frontend เอง → ยิงไม่ถึง backend
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:4000}
        # ⚠️ ห้ามปล่อยว่าง — เบราว์เซอร์ต้องคุยกับโดเมนตัวเองแล้วให้ Next rewrite ต่อ
        #    ไม่งั้น cookie ถูกบล็อกแบบ third-party (docs/06-deployment.md §3.1)
        #    และห้ามขึ้นต้นด้วย /api เพราะทับ /api/auth/* ของ Auth.js
        NEXT_PUBLIC_API_PROXY_PATH: ${NEXT_PUBLIC_API_PROXY_PATH:-/backend}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-TeenStyle}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    container_name: teenstyle-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # ⚠️ ห้ามลืม — Auth.js เก็บ session ในฐานข้อมูลผ่าน Prisma adapter (STEP 3)
      #    ไม่มีค่านี้ หน้าเว็บเปิดได้แต่ล็อกอินไม่ได้เลย เพราะ getPrisma() โยน error
      DATABASE_URL: postgresql://${POSTGRES_USER:-teenstyle}:${POSTGRES_PASSWORD:-teenstyle_dev_password}@postgres:5432/${POSTGRES_DB:-teenstyle}?schema=public
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - teenstyle

volumes:
  postgres-data:
  redis-data:
  # ไฟล์รูปสินค้า/รีวิว (STEP 47) — backup ต้องรวม volume นี้ด้วย ไม่ใช่แค่ฐานข้อมูล
  uploads:

networks:
  teenstyle:
    driver: bridge
