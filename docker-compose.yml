###############################################################################
# TEENSTYLE AI — Docker Compose (STEP 35)
#
# ใช้งาน:
#   docker compose up -d postgres redis   # เปิดแค่ฐานข้อมูล + cache (แนะนำตอน dev)
#   docker compose up -d                  # เปิดทั้งระบบรวม frontend/backend
#   docker compose down                   # ปิด (ข้อมูลยังอยู่ใน volume)
#   docker compose down -v                # ปิดและลบข้อมูลทั้งหมด
#
# ⚠️ ต้องเปิด Docker Desktop ก่อน
# ค่าทั้งหมดอ่านจากไฟล์ .env ที่ root (คัดลอกจาก .env.example)
###############################################################################

services:
  postgres:
    image: postgres:17-alpine
    container_name: teenstyle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teenstyle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teenstyle_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-teenstyle}
      # เร่ง initdb และให้ collation คงที่ทุกเครื่อง
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: ${TZ:-Asia/Bangkok}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teenstyle} -d ${POSTGRES_DB:-teenstyle}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - teenstyle

  redis:
    image: redis:7-alpine
    container_name: teenstyle-redis
    restart: unless-stopped
    # appendonly เพื่อไม่ให้ job ที่ค้างใน BullMQ หายตอน restart (STEP 52)
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - teenstyle

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: teenstyle-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BACKEND_PORT: 4000
      BACKEND_URL: ${BACKEND_URL:-http://localhost:4000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # ใช้ชื่อ service เป็น host เพราะอยู่ใน network เดียวกัน
      DATABASE_URL: postgresql://${POSTGRES_USER:-teenstyle}:${POSTGRES_PASSWORD:-teenstyle_dev_password}@postgres:5432/${POSTGRES_DB:-teenstyle}?schema=public
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH_SECRET: ${AUTH_SECRET:-}
      BACKEND_JWT_SECRET: ${BACKEND_JWT_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      PAYMENT_SECRET: ${PAYMENT_SECRET:-}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    networks:
      - teenstyle

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        # NEXT_PUBLIC_* ต้องมีตอน build เพราะถูกฝังลง bundle
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-TeenStyle}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    container_name: teenstyle-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - teenstyle

volumes:
  postgres-data:
  redis-data:

networks:
  teenstyle:
    driver: bridge
